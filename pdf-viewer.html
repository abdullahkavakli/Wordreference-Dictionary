<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title data-i18n="pdfViewerTitle">WordReference PDF Viewer</title>
  <style>
    :root {
      --wr-bg: #2b2723;
      --wr-page-bg: #fefcf8;
      --wr-toolbar-bg: #1f1d1a;
      --wr-toolbar-fg: #efe5d4;
      --wr-accent: #d8b074;
      --wr-line: #4a423a;
      --wr-error: #ff6b6b;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--wr-bg);
      font-family: "Trebuchet MS", "Gill Sans", sans-serif;
      color: var(--wr-toolbar-fg);
    }

    #toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: var(--wr-toolbar-bg);
      border-bottom: 1px solid var(--wr-line);
      font-size: 13px;
    }

    #toolbar .title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--wr-toolbar-fg);
    }

    #toolbar .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #toolbar button {
      background: transparent;
      border: 1px solid var(--wr-line);
      color: var(--wr-toolbar-fg);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    #toolbar button:hover {
      border-color: var(--wr-accent);
      color: var(--wr-accent);
    }

    #toolbar .badge {
      color: var(--wr-accent);
      font-weight: 600;
    }

    #toolbar input[type="number"] {
      width: 50px;
      padding: 4px 6px;
      border: 1px solid var(--wr-line);
      background: #16140f;
      color: var(--wr-toolbar-fg);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      text-align: center;
      -moz-appearance: textfield;
    }

    #toolbar input[type="number"]::-webkit-inner-spin-button,
    #toolbar input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #toolbar input[type="number"]:focus {
      outline: none;
      border-color: var(--wr-accent);
    }

    #toolbar .hint {
      color: #8c857b;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    #pages {
      padding: 24px 0 64px;
    }

    .pdf-page {
      position: relative;
      margin: 0 auto 18px;
      background: var(--wr-page-bg);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .pdf-page .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1;
      color: transparent;
    }

    .pdf-page .textLayer > span,
    .pdf-page .textLayer > br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .pdf-page .textLayer ::selection {
      background: rgba(216, 176, 116, 0.45);
      color: transparent;
    }

    #status {
      max-width: 720px;
      margin: 80px auto;
      padding: 24px 32px;
      background: var(--wr-toolbar-bg);
      border: 1px solid var(--wr-line);
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    #status.error {
      border-color: var(--wr-error);
      color: var(--wr-error);
    }

    #status a {
      color: var(--wr-accent);
    }
  </style>
</head>

<body>
  <div id="toolbar">
    <span class="title" id="filename">…</span>
    <span class="group">
      <button id="prev-page" title="Previous page" data-i18n-title="pdfViewerPrevPage">↑</button>
      <input type="number" id="page-input" min="1" value="1" aria-label="Page number" data-i18n-aria-label="pdfViewerPageLabel">
      <span class="badge" id="page-total">/ –</span>
      <button id="next-page" title="Next page" data-i18n-title="pdfViewerNextPage">↓</button>
    </span>
    <span class="group">
      <button id="zoom-out" title="Zoom out" data-i18n-title="pdfViewerZoomOut">−</button>
      <span class="badge" id="zoom-info">125%</span>
      <button id="zoom-in" title="Zoom in" data-i18n-title="pdfViewerZoomIn">+</button>
      <button id="zoom-fit" title="Fit to width" data-i18n-title="pdfViewerFitWidth">⤢</button>
    </span>
    <span class="group">
      <button id="download-btn" data-i18n="pdfViewerDownload">↓ Save</button>
      <button id="print-btn" data-i18n="pdfViewerPrint">⎙ Print</button>
    </span>
    <span class="hint" data-i18n="pdfViewerHint">Alt + double-click · Alt + X · Alt + Q to look up a word</span>
  </div>

  <div id="pages"></div>
  <div id="status" data-i18n="pdfViewerLoading">Preparing PDF viewer…</div>

  <script src="scripts/i18n.js"></script>
  <script type="module" src="scripts/pdf-viewer.js"></script>

  <!-- Load WR favorites + content script so Alt+X / Alt+Q / Alt+dblclick work over the rendered text layer -->
  <script src="scripts/favorites.js"></script>
  <script src="scripts/content.js"></script>
</body>

</html>
