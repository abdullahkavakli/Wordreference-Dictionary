<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="styles/main.css" rel="stylesheet">
  <link href="styles/loading.css" rel="stylesheet">
</head>

<body>

  <!-- Search bar -->
  <div class="text-center">
    <div id="form_div">
      <div class="input-row">
        <label for="search-input" class="sr-only" data-i18n="popupSearchLabel">Search WordReference</label>
        <input type="search" class="form-control" id="search-input" placeholder="Search WordReference…"
          data-i18n-placeholder="popupSearchPlaceholder" autocomplete="off" autofocus tabindex="1">
        <button type="button" class="btn btn-primary" id="wr-btn" title="Search WordReference"
          data-i18n-title="popupSearchLabel" data-i18n="popupSearchButton">Search</button>
      </div>
    </div>
  </div>

  <!-- Headword, pronunciation, favorite, open in WR -->
  <div id="voice-tts" class="container">
    <div class="headword-row">
      <h1 id="headword" class="headword" lang="en"></h1>
      <span id="ipa-inline" class="wr-ipa-inline" aria-live="polite"></span>
    </div>
    <div class="pron" role="group" aria-label="Pronunciation">
      <span class="pron-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path
            d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg></span>
      <button type="button" id="flag-tr-btn" class="pron-btn" aria-label="Play Turkish pronunciation">TR</button>
      <button type="button" id="flag-es-btn" class="pron-btn" aria-label="Play Spanish pronunciation">ES</button>
      <button type="button" id="flag-it-btn" class="pron-btn" aria-label="Play Italian pronunciation">IT</button>
      <button type="button" id="flag-pt-btn" class="pron-btn" aria-label="Play Portuguese pronunciation">PT</button>
      <button type="button" id="flag-fr-btn" class="pron-btn" aria-label="Play French pronunciation">FR</button>
      <button type="button" id="flag-de-btn" class="pron-btn" aria-label="Play German pronunciation">DE</button>
      <button type="button" id="flag-nl-btn" class="pron-btn" aria-label="Play Dutch pronunciation">NL</button>
      <button type="button" id="flag-sv-btn" class="pron-btn" aria-label="Play Swedish pronunciation">SV</button>
      <button type="button" id="flag-ar-btn" class="pron-btn" aria-label="Play Arabic pronunciation">AR</button>
      <button type="button" id="flag-zh-btn" class="pron-btn" aria-label="Play Chinese pronunciation">ZH</button>
      <button type="button" id="flag-ru-btn" class="pron-btn" aria-label="Play Russian pronunciation">RU</button>
      <button type="button" id="flag-gr-btn" class="pron-btn" aria-label="Play Greek pronunciation">GR</button>
      <button type="button" id="flag-pl-btn" class="pron-btn" aria-label="Play Polish pronunciation">PL</button>
      <button type="button" id="flag-ro-btn" class="pron-btn" aria-label="Play Romanian pronunciation">RO</button>
      <button type="button" id="flag-cz-btn" class="pron-btn" aria-label="Play Czech pronunciation">CZ</button>
      <button type="button" id="flag-ja-btn" class="pron-btn" aria-label="Play Japanese pronunciation">JA</button>
      <button type="button" id="flag-ko-btn" class="pron-btn" aria-label="Play Korean pronunciation">KO</button>
      <button type="button" id="flag-is-btn" class="pron-btn" aria-label="Play Icelandic pronunciation">IS</button>
      <button type="button" id="flag-us-btn" class="pron-btn" aria-label="Play American English pronunciation">US</button>
      <button type="button" id="flag-uk-btn" class="pron-btn" aria-label="Play British English pronunciation">UK</button>
    </div>
    <span id="favorite-status" class="favorite-status" aria-live="polite"></span>
    <button type="button" id="favorite-btn" class="icon-btn favorite-btn" aria-label="Add to favorites"
      title="Add to favorites" data-i18n-aria-label="popupAddFavorite" data-i18n-title="popupAddFavorite">☆</button>
    <button type="button" id="wr-logo-btn" class="icon-btn wr-logo-btn" aria-label="Open in WordReference"
      title="Open in WordReference" data-i18n-aria-label="popupOpenInWR" data-i18n-title="popupOpenInWR"><svg
        aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><path
          d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  </div>

  <!-- Results -->
  <div class="search_results">
    <div id="loading">
      <div class="outer-shadow"></div>
      <div class="inner-shadow"></div>
      <div class="timer">
        <div class="dot"><span></span></div>
        <div class="hold" id="left">
          <div class="pie"></div>
        </div>
        <div class="hold" id="right">
          <div class="pie"></div>
        </div>
      </div>
    </div>

    <div id="content"></div>
    <div class="popup-footer">
      <span>&copy; 2026 Abdullah Kavaklı</span>
      <span class="popup-footer-source" data-i18n="popupFooterSource">Results from WordReference.com</span>
    </div>
  </div>

  <script src="scripts/i18n.js"></script>
  <script src="scripts/favorites.js"></script>
  <script src="scripts/parser.js"></script>
  <script src="scripts/popup.js"></script>
</body>

</html>
